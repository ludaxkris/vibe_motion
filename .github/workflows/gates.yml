name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.event.pull_request.number || github.sha }}
  # Only PR runs are cancellable. On main every commit must finish its own run: Render deploys
  # on `autoDeployTrigger: checksPass` per commit, and a cancelled run means that commit never
  # deploys (a docs(memory) push 41s after the Phase 2 merge did exactly that, 2026-09-18).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  catalog:
    name: catalog gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-immutable diffs against origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates:catalog

  bridge:
    name: bridge gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache the browser download, not the apt packages: `playwright install` re-downloads
      # ~150MB of Chromium on every run otherwise, for a suite that takes five seconds. Keyed on
      # the resolved Playwright version so a bump invalidates it. The web and e2e jobs do not
      # cache today; this is deliberately scoped to the bridge job.
      - id: pw-version
        run: echo "version=$(node -p "require('./packages/bridge/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter bridge exec playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter bridge exec playwright install --with-deps chromium
      - run: pnpm gates:bridge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # `trace: "on-first-retry"` writes here. The CI reporter is github + list, so no HTML
          # report directory is ever created.
          name: bridge-playwright-traces
          path: packages/bridge/test-results
          retention-days: 7

  web:
    name: web gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: api gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: node scripts/gates.mjs api
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  e2e:
    name: e2e gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm gates:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  gate-flag:
    name: Gate Flag
    needs: [catalog, bridge, web, api, e2e]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== 'success')
              .map(([k, v]) => `${k} (${v.result})`);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const label = 'Gate Flag';
            const marker = '<!-- vibe-motion-gate-flag -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (failed.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              const body = `${marker}\n## 🚩 Gate Flag\n\nThe following gate groups are not passing on \`${context.payload.pull_request.head.sha.slice(0,7)}\`:\n\n${failed.map(f => `- ❌ ${f}`).join('\n')}\n\nThis PR must not be marked ready for review until every gate is green. See [the run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}).`;
              if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.setFailed(`Gate Flag: ${failed.join(', ')}`);
            } else {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }); } catch (e) { if (e.status !== 404) throw e; }
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${marker}\n## ✅ All gates green\n\nGate Flag cleared on \`${context.payload.pull_request.head.sha.slice(0,7)}\`.` });
              }
            }
