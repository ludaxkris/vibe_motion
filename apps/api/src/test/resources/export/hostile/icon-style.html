<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<title>icon-style</title>
</head>
<body>
<p>An inline icon that styles itself, the way real pages do. Nothing hostile here: this document is
in the corpus so the browser gate proves the narrow keep actually renders, not only that the
hostile ones stay inert.</p>
<svg id="icon" width="24" height="24" viewBox="0 0 24 24">
  <style>.icon-dot { fill: rgb(0, 128, 0); } svg > circle { stroke: rgb(0, 0, 255); }</style>
  <circle id="dot" class="icon-dot" cx="12" cy="12" r="10"></circle>
</svg>
</body>
</html>
