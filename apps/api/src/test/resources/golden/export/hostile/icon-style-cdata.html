<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<title>icon-style-cdata</title>
<link rel="stylesheet" href="vibe-motion.css"></head>
<body>
<p>The shape Illustrator, Inkscape and Sketch export: the icon's CSS wrapped in a CDATA section.</p>
<svg id="icon" width="24" height="24" viewBox="0 0 24 24">
  <style type="text/css"> .cdata-dot { fill: rgb(128, 0, 128); } svg &gt; circle { stroke: rgb(255, 0, 0); } </style>
  <circle id="dot" class="cdata-dot" cx="12" cy="12" r="10"></circle>
</svg>
</body>
</html>
