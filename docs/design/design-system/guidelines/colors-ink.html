<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:#fff;display:flex;align-items:center;justify-content:center;color:var(--vm-ink);font:var(--type-ui-strong)">Body 13</i><b>--vm-ink</b><span>#1d1d1f</span></div><div class="sw"><i style="background:#fff;display:flex;align-items:center;justify-content:center;color:var(--vm-ink-2);font-size:12px">Muted 12</i><b>--vm-ink-2</b><span>#7a7392 captions, labels</span></div><div class="sw"><i style="background:#fff;display:flex;align-items:center;justify-content:center;color:var(--vm-ink-3);font-size:12px">Faint · units</i><b>--vm-ink-3</b><span>#a89fc9 units, placeholders</span></div><div class="sw"><i style="background:#fff;display:flex;align-items:center;justify-content:center;color:var(--vm-ink-4);font-size:12px">Disabled</i><b>--vm-ink-4</b><span>#cfc9e6</span></div><div class="sw"><i style="background:var(--vm-bar);display:flex;align-items:center;justify-content:center;color:var(--vm-ink-inverse);font-size:12px">On bar</i><b>--vm-ink-inverse</b><span>#fff</span></div></div></body></html>
