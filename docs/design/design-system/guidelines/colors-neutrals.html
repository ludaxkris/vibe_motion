<!-- @dsCard group="Colors" viewport="700x150" subtitle="Canvas → panel → card, plus borders" name="Neutral surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--vm-canvas)"></i><b>--vm-canvas</b><span>canvas</span></div><div class="sw"><i style="background:var(--vm-panel)"></i><b>--vm-panel</b><span>panel</span></div><div class="sw"><i style="background:var(--vm-surface)"></i><b>--vm-surface</b><span>card / sheet</span></div><div class="sw"><i style="background:var(--vm-surface-muted)"></i><b>--vm-surface-muted</b><span>control bg</span></div><div class="sw"><i style="background:var(--vm-surface-sunken)"></i><b>--vm-surface-sunken</b><span>track</span></div><div class="sw"><i style="background:var(--vm-border)"></i><b>--vm-border</b><span>border / divider</span></div></div></body></html>
