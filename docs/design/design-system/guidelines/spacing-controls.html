<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Control heights 28 / 30 / 36 / 40 / 44" name="Control sizes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div class="sw"><i style="height:var(--control-h-xs);background:#fff;border:1px solid var(--border-control);border-radius:var(--radius-md)"></i><span>28 number</span></div><div class="sw"><i style="height:var(--control-h-sm);background:#fff;border:1px solid var(--border-control);border-radius:var(--radius-md)"></i><span>30 replay</span></div><div class="sw"><i style="height:var(--control-h-md);background:#fff;border:1px solid var(--border-control);border-radius:var(--radius-md)"></i><span>36 save</span></div><div class="sw"><i style="height:var(--control-h-lg);background:#fff;border:1px solid var(--border-control);border-radius:var(--radius-md)"></i><span>40 generate</span></div><div class="sw"><i style="height:var(--control-h-xl);background:#fff;border:1px solid var(--border-control);border-radius:var(--radius-md)"></i><span>44 url</span></div></div></body></html>
