<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div style="background:var(--vm-bar);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:14px;color:var(--vm-bar-ink)"><span style="font-weight:700;font-size:13px;letter-spacing:var(--tracking-snug)">Vibe Motion</span><span style="width:1px;height:16px;background:var(--vm-bar-border)"></span><span style="font-size:13px;font-weight:500;color:var(--vm-bar-ink-muted)">nimbus.app/pricing</span><span style="font:var(--type-mono);font-size:11px;background:var(--vm-bar-chip);padding:3px 6px;border-radius:var(--radius-xs)">v5</span><span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--vm-bar-ink-muted)"><i style="width:7px;height:7px;border-radius:50%;background:var(--vm-bar-dot)"></i>Unsaved</span><span style="margin-left:auto;height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--vm-bar-border);display:flex;align-items:center;font-size:12px;font-weight:500">Cancel</span><span style="height:28px;padding:0 14px;border-radius:7px;background:var(--vm-bar-accent);display:flex;align-items:center;font-size:12px;font-weight:600">Save</span></div><div class="row" style="margin-top:12px"><div class="sw"><b>--vm-bar</b><span>#221b45</span></div><div class="sw"><b>--vm-bar-accent</b><span>#8f74ff Save</span></div><div class="sw"><b>--vm-bar-dot</b><span>#b39dff unsaved</span></div><div class="sw"><b>--vm-bar-chip</b><span>white 12% version</span></div></div></body></html>
