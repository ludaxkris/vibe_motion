<!-- @dsCard group="Surfaces" viewport="700x200" subtitle="Canvas → floating sheet; panel → white card with folder tab" name="Sheet & panel card" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px;height:160px"><div style="flex:2;background:var(--vm-canvas);padding:var(--canvas-inset) var(--canvas-inset) 0;border-radius:var(--radius-md)"><div style="height:100%;background:#fff;border-radius:10px 10px 0 0;box-shadow:var(--shadow-sheet)"></div></div><div style="flex:1;background:var(--vm-panel);border-left:1px solid var(--vm-border);padding:12px 12px 0;display:flex;flex-direction:column"><div style="display:flex;gap:2px"><span style="flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;background:#fff;border-radius:8px 8px 0 0;border:1px solid var(--vm-border);border-bottom-color:#fff;margin-bottom:-1px;color:var(--text-tab-active)">Animate</span><span style="flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--text-muted)">History</span><span style="flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--text-muted)">Export</span></div><div style="flex:1;background:#fff;border:1px solid var(--vm-border);border-radius:0 10px 0 0"></div></div></div></body></html>
