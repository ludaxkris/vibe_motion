<!-- @dsCard group="Spacing" viewport="700x150" subtitle="6 inputs · 8 buttons · 10–12 cards · 14 dialogs · pill chips" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-xs)"></i><b>--radius-xs</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-sm)"></i><b>--radius-sm</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-md)"></i><b>--radius-md</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-lg)"></i><b>--radius-lg</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-xl)"></i><b>--radius-xl</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-2xl)"></i><b>--radius-2xl</b></div><div class="sw"><i style="background:var(--vm-surface-muted);border:1.5px solid var(--vm-accent);border-radius:var(--radius-pill)"></i><b>--radius-pill</b></div></div></body></html>
