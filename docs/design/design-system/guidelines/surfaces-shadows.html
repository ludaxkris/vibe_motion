<!-- @dsCard group="Surfaces" viewport="700x150" subtitle="Violet-tinted, low contrast" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:#fff;box-shadow:var(--shadow-sheet);border:0"></i><b>--shadow-sheet</b><span>sheet</span></div><div class="sw"><i style="background:#fff;box-shadow:var(--shadow-card);border:0"></i><b>--shadow-card</b><span>card</span></div><div class="sw"><i style="background:#fff;box-shadow:var(--shadow-raised);border:0"></i><b>--shadow-raised</b><span>segment</span></div><div class="sw"><i style="background:#fff;box-shadow:var(--shadow-popover);border:0"></i><b>--shadow-popover</b><span>banner</span></div><div class="sw"><i style="background:#fff;box-shadow:var(--shadow-modal);border:0"></i><b>--shadow-modal</b><span>dialog</span></div><div class="sw"><i style="background:var(--vm-accent);box-shadow:var(--shadow-accent);border:0"></i><b>--shadow-accent</b><span>save glow</span></div></div></body></html>
