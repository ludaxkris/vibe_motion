<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><b>--vm-default-duration</b><span>600ms</span></div><div class="sw"><b>--vm-default-delay</b><span>0ms</span></div><div class="sw"><b>--vm-default-easing</b><span>ease-out</span></div><div class="sw"><b>--vm-default-distance</b><span>24px</span></div><div class="sw"><b>--vm-default-scale</b><span>1.05 (pulse)</span></div><div class="sw"><b>--vm-stagger</b><span>120ms between siblings</span></div></div></body></html>
