<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-1);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">1</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-2);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">2</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-3);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">3</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-4);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">4</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-5);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">5</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-6);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">6</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-7);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">7</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-8);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">8</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-9);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">9</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-10);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">10</span></div><div class="sw" style="min-width:0;align-items:center"><i style="width:100%;height:var(--space-12);background:var(--vm-accent);border:0;border-radius:2px"></i><span style="font:var(--type-mono);font-size:10px">12</span></div></div></body></html>
