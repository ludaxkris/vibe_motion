<!-- @dsCard group="Colors" viewport="700x150" subtitle="Only as diff signs, status dots and error text" name="Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--vm-success)"></i><b>--vm-success</b><span>+ added · cloned ✓</span></div><div class="sw"><i style="background:var(--vm-warning)"></i><b>--vm-warning</b><span>~ changed</span></div><div class="sw"><i style="background:var(--vm-danger)"></i><b>--vm-danger</b><span>− removed · errors · Remove</span></div><div class="sw"><i style="background:var(--vm-scrim)"></i><b>--vm-scrim</b><span>modal scrim 40%</span></div></div><div style="margin-top:12px;display:flex;gap:16px;font-size:12px"><span><b style="color:var(--diff-add)">+</b> <code style="font:var(--type-mono);background:var(--vm-surface-muted);padding:1px 5px;border-radius:4px">h1</code> Fade In Up</span><span><b style="color:var(--diff-change)">~</b> <code style="font:var(--type-mono);background:var(--vm-surface-muted);padding:1px 5px;border-radius:4px">a.cta</code> Pulse · load → hover</span><span><b style="color:var(--diff-remove)">−</b> <code style="font:var(--type-mono);background:var(--vm-surface-muted);padding:1px 5px;border-radius:4px">.plan:2</code> removed</span><span style="color:var(--text-danger);font-weight:500;margin-left:auto">Remove animation</span></div></body></html>
