<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--vm-accent)"></i><b>--vm-accent</b><span>#7c5cff · rings, fills, primary</span></div><div class="sw"><i style="background:var(--vm-accent-strong)"></i><b>--vm-accent-strong</b><span>#4a35b8 · active tab text</span></div><div class="sw"><i style="background:var(--vm-accent-hover)"></i><b>--vm-accent-hover</b><span>#6b4de6 hover</span></div><div class="sw"><i style="background:var(--vm-accent-pressed)"></i><b>--vm-accent-pressed</b><span>#5b3fd0 pressed</span></div><div class="sw"><i style="background:var(--vm-accent-soft)"></i><b>--vm-accent-soft</b><span>15% · focus ring</span></div><div class="sw"><i style="background:var(--vm-accent-tint)"></i><b>--vm-accent-tint</b><span>#f3f0ff · preview bg</span></div></div></body></html>
