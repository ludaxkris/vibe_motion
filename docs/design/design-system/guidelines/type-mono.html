<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font:var(--type-ui);color:var(--text-body);background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}.sw b{font:var(--type-mono);color:var(--text-body)}.sw span{font:var(--type-caption);color:var(--text-muted)}.lbl{font:var(--type-label);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font:var(--type-mono);background:var(--vm-accent);color:#fff;padding:3px 8px;border-radius:var(--radius-sm)">h1</span><span style="font:var(--type-mono);background:var(--vm-surface-muted);padding:2px 6px;border-radius:5px">.plan:2</span><span style="font:var(--type-mono);font-size:11px;background:var(--vm-surface-muted);color:var(--text-muted);padding:2px 6px;border-radius:4px">v5</span><span style="display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 8px;border:1px solid var(--border-control);border-radius:var(--radius-sm);font:var(--type-mono)">600<span style="color:var(--text-faint)">ms</span></span><span style="display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 8px;border:1px solid var(--border-control);border-radius:var(--radius-sm);font:var(--type-mono)">24<span style="color:var(--text-faint)">px</span></span><span style="font:var(--type-mono)">ease-out</span></div><pre style="margin:12px 0 0;background:var(--vm-ink);color:#d4d4d8;border-radius:var(--radius-md);padding:10px 12px;font:10.5px/1.6 var(--font-mono)">.vm-a1 { animation: vm-fade-in-up-v1 600ms ease-out 0ms 1 both; }</pre></body></html>
